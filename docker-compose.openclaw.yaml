services:
  openclaw-container:
    container_name: openclaw_container
    build:
      context: ./openclaw
      dockerfile: Dockerfile
    image: openclaw:latest
    restart: unless-stopped
    ports:
      - "18789:18789"
      - "22:22" # Map to host port 2222 to avoid conflict with host SSH
